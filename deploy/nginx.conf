pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format nd_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
  access_log /dev/stdout nd_noquery;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  # Backend enforces the school-specific 1..100 MiB file limit. Permit its
  # maximum plus multipart overhead, rather than the nginx default 1 MiB.
  client_max_body_size 101m;
  client_body_buffer_size 128k;
  client_body_timeout 20s;
  # 页面文件压缩后传输：约 840KB 降到约 250KB，学校网络慢时差别最明显。
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  # 学校域名访问时前面还有一层反向代理，转发用 HTTP/1.0、可能带 Via 头；nginx 默认对这两种请求都不压缩，
  # 页面脚本和接口数据会按原大小（app.js 约 500KB）传。下面两行让经过学校代理的请求也压缩。
  gzip_http_version 1.0;
  gzip_proxied any;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Unhashed source assets must not stay stale across an R10 -> R11 deployment.
    add_header Cache-Control "no-store" always;
    root /usr/share/nginx/html;
    # Both direct FastAPI and the deployed frontend serve the same /assets URL.
    # A missing script returns 404 here, never the SPA index.html fallback.
    location ^~ /assets/ {
      alias /usr/share/nginx/html/;
      autoindex off;
      # 静态文件改为“每次先问服务器有没有变”：没变只回 304，不再整包重下；
      # 部署新版后浏览器会立刻拿到新文件。location 里写 add_header 会盖掉 server 级的头，所以安全头在这里重写一遍。
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control "no-cache" always;
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      # 学校反向代理转发来的原始链，原样交给程序；程序只在直连方是可信代理时才采用（ND_TRUSTED_PROXIES）。
      proxy_set_header X-Client-Chain $http_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
