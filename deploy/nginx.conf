pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format nd_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
  access_log /dev/stdout nd_noquery;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  # Backend enforces the school-specific 1..100 MiB file limit. Permit its
  # maximum plus multipart overhead, rather than the nginx default 1 MiB.
  client_max_body_size 101m;
  client_body_buffer_size 128k;
  client_body_timeout 20s;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Unhashed source assets must not stay stale across an R10 -> R11 deployment.
    add_header Cache-Control "no-store" always;
    root /usr/share/nginx/html;
    # Both direct FastAPI and the deployed frontend serve the same /assets URL.
    # A missing script returns 404 here, never the SPA index.html fallback.
    location ^~ /assets/ {
      alias /usr/share/nginx/html/;
      autoindex off;
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      # 学校反向代理转发来的原始链，原样交给程序；程序只在直连方是可信代理时才采用（ND_TRUSTED_PROXIES）。
      proxy_set_header X-Client-Chain $http_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
